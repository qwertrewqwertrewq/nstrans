<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>官方客户端登录 · NSTrans</title><link rel="icon" href="/project-logo.svg"><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/account.css"></head>
<body data-page="client-login">
  <nav class="site-nav"><a class="brand" href="/"><img src="/project-logo.svg" alt=""><span class="brand-word">NSTrans</span></a><div class="site-links"><a href="/auth/github">使用 GitHub 登录</a></div></nav>
  <main class="account-auth"><section><span class="kicker">OFFICIAL CLIENT</span><h1>登录 NSTrans 社区</h1><p>此页面由通过签名校验的官方客户端打开。客户端账号与 GitHub 账号拥有相同的词库、评分和密钥权限。</p><div id="authFlash" class="auth-flash" hidden></div><div class="auth-grid"><form id="clientLoginForm" class="panel"><h2>已有账号</h2><label>用户名<input name="username" autocomplete="username" required maxlength="32"></label><label>密码<input name="password" type="password" autocomplete="current-password" required maxlength="128"></label><button class="button" type="submit">登录</button></form><form id="clientRegisterForm" class="panel"><h2>创建账号</h2><label>用户名<input name="username" autocomplete="username" required minlength="3" maxlength="32"></label><label>密码（至少 10 位）<input name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="128"></label><button class="button" type="submit">注册并登录</button></form></div><div class="auth-divider"><span>或者</span></div><a class="button secondary" href="/auth/github">继续使用 GitHub 登录</a></section></main>
  <script src="/client-login.js" defer></script>
</body></html>
