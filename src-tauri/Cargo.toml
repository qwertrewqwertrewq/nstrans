[package]
name = "nstrans"
version = "0.1.0"
description = "Real-time Japanese OCR and translation overlay"
authors = ["NSTrans contributors"]
license = "Apache-2.0"
repository = "https://github.com/qwertrewqwertrewq/nstrans"
edition = "2021"
rust-version = "1.77.2"

[features]
default = []
local-llama = ["dep:llama-cpp-2", "dep:encoding_rs"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nstrans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
base64 = "0.22"
libc = "0.2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
rfd = "0.16"

[target.'cfg(target_os = "android")'.dependencies]
llama-cpp-2 = { version = "0.1.154", default-features = false, features = ["android-static-stdcxx"], optional = true }
encoding_rs = { version = "0.8", optional = true }

[target.'cfg(target_os = "ios")'.dependencies]
llama-cpp-2 = { version = "0.1.154", default-features = false, features = ["metal"], optional = true }
encoding_rs = { version = "0.8", optional = true }
