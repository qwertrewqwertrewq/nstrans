name: Desktop 1.0.0 hotfix

on:
  push:
    branches: [main]
    paths: ['.github/workflows/desktop-hotfix.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-hotfix-v1.0.0
  cancel-in-progress: false

env:
  RELEASE_TAG: v1.0.0
  OLLAMA_VERSION: 0.12.3
  WINDOWS_OLLAMA_VERSION: 0.33.3
  CLIENT_BUILD_KEY_ID: nstrans-release-2026-01

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - run: |
          npm ci --ignore-scripts
          test "$(node -p 'require("./package.json").version')" = "1.0.0"
          npm test
          npm run build
      - name: Require existing published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = "false"

  macos:
    name: macOS · WithLlama + RemoteOnly
    needs: validate
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies and native runtimes
        shell: bash
        run: |
          npm ci --ignore-scripts
          ./scripts/setup-macos-runtime.sh "$OLLAMA_VERSION"

      - name: Build and stage both DMGs
        env:
          CLIENT_BUILD_SIGNING_KEY: ${{ secrets.CLIENT_BUILD_SIGNING_KEY }}
        shell: bash
        run: |
          mkdir -p release-assets
          export NSTRANS_BUILD_ATTESTATION="$(node scripts/sign-client-build.mjs --platform macos --variant with-llama)"
          npm run desktop:build:full
          cp src-tauri/target/release/bundle/dmg/NSTrans_*_aarch64.dmg "release-assets/NSTrans-${RELEASE_TAG#v}-macOS-arm64-WithLlama.dmg"
          export NSTRANS_BUILD_ATTESTATION="$(node scripts/sign-client-build.mjs --platform macos --variant remote-only)"
          npm run desktop:build:remote
          cp src-tauri/target/release/bundle/dmg/NSTrans_*_aarch64_remote-only.dmg "release-assets/NSTrans-${RELEASE_TAG#v}-macOS-arm64-RemoteOnly.dmg"
          cd release-assets
          for file in *.dmg; do shasum -a 256 "$file" > "$file.sha256"; done

      - name: Upload macOS assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" release-assets/* --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    name: Windows · WithLlama + RemoteOnly
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 210
    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install dependencies and native runtimes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-windows-runtime.ps1 -OllamaVersion $env:WINDOWS_OLLAMA_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and stage both NSIS installers
        env:
          CLIENT_BUILD_SIGNING_KEY: ${{ secrets.CLIENT_BUILD_SIGNING_KEY }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $Version = $env:RELEASE_TAG.TrimStart('v')
          $env:NSTRANS_BUILD_ATTESTATION = node scripts/sign-client-build.mjs --platform windows --variant with-llama
          npm run windows:build:full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Source = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction Stop | Select-Object -First 1
          if (-not $Source) { throw "WithLlama NSIS installer was not produced." }
          Copy-Item $Source.FullName "release-assets/NSTrans-$Version-Windows-x64-WithLlama-setup.exe"
          $env:NSTRANS_BUILD_ATTESTATION = node scripts/sign-client-build.mjs --platform windows --variant remote-only
          npm run windows:build:remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $Source = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction Stop | Select-Object -First 1
          if (-not $Source) { throw "RemoteOnly NSIS installer was not produced." }
          Copy-Item $Source.FullName "release-assets/NSTrans-$Version-Windows-x64-RemoteOnly-setup.exe"
          Get-ChildItem release-assets/*.exe | ForEach-Object {
            $Hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$Hash  $($_.Name)" | Set-Content "$($_.FullName).sha256" -Encoding ascii
          }

      - name: Upload Windows assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload $env:RELEASE_TAG release-assets/* --repo $env:GITHUB_REPOSITORY --clobber

