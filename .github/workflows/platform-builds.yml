name: Cross-platform builds

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: platform-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  OLLAMA_VERSION: 0.12.3
  WINDOWS_OLLAMA_VERSION: 0.33.3

jobs:
  macos:
    name: macOS · WithLlama + RemoteOnly
    runs-on: macos-26
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install dependencies and native runtimes
        run: |
          npm ci --ignore-scripts
          ./scripts/setup-macos-runtime.sh "$OLLAMA_VERSION"
      - name: Build WithLlama DMG
        run: |
          npm run desktop:build:full
          mkdir -p artifacts/WithLlama
          cp src-tauri/target/release/bundle/dmg/NSTrans_*_aarch64.dmg artifacts/WithLlama/NSTrans-macOS-arm64-WithLlama.dmg
      - name: Build RemoteOnly DMG
        run: |
          npm run desktop:build:remote
          mkdir -p artifacts/RemoteOnly
          cp src-tauri/target/release/bundle/dmg/NSTrans_*_aarch64_remote-only.dmg artifacts/RemoteOnly/NSTrans-macOS-arm64-RemoteOnly.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: NSTrans-macOS-arm64-WithLlama
          path: artifacts/WithLlama/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NSTrans-macOS-arm64-RemoteOnly
          path: artifacts/RemoteOnly/*
          if-no-files-found: error

  ipados:
    name: iPadOS · WithLlama + RemoteOnly
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - name: Set up Rust for iOS
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build WithLlama unsigned IPA
        run: |
          npm run ios:build:with-llama
          mkdir -p artifacts/WithLlama
          cp src-tauri/gen/apple/build/arm64/NSTrans.ipa artifacts/WithLlama/NSTrans-iPadOS-arm64-unsigned-WithLlama.ipa
      - name: Build RemoteOnly unsigned IPA
        run: |
          npm run ios:build:remote
          mkdir -p artifacts/RemoteOnly
          cp src-tauri/gen/apple/build/arm64/NSTrans.ipa artifacts/RemoteOnly/NSTrans-iPadOS-arm64-unsigned-RemoteOnly.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: NSTrans-iPadOS-arm64-unsigned-WithLlama
          path: artifacts/WithLlama/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NSTrans-iPadOS-arm64-unsigned-RemoteOnly
          path: artifacts/RemoteOnly/*
          if-no-files-found: error

  android:
    name: Android · WithLlama + RemoteOnly
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK and Rust
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-linux-android
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Build WithLlama APK
        run: |
          npm run android:build:with-llama
          mkdir -p artifacts/WithLlama
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk artifacts/WithLlama/NSTrans-Android-arm64-debug-WithLlama.apk
      - name: Build RemoteOnly APK
        run: |
          npm run android:build:remote
          mkdir -p artifacts/RemoteOnly
          cp src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk artifacts/RemoteOnly/NSTrans-Android-arm64-debug-RemoteOnly.apk
      - name: Verify Android variants
        run: |
          with_apk=artifacts/WithLlama/NSTrans-Android-arm64-debug-WithLlama.apk
          remote_apk=artifacts/RemoteOnly/NSTrans-Android-arm64-debug-RemoteOnly.apk
          mkdir -p artifacts/android-verify
          unzip -p "$with_apk" lib/arm64-v8a/libnstrans_lib.so > artifacts/android-verify/with-llama.so
          unzip -p "$remote_apk" lib/arm64-v8a/libnstrans_lib.so > artifacts/android-verify/remote-only.so
          with_size=$(stat -c%s "$with_apk")
          remote_size=$(stat -c%s "$remote_apk")
          with_so_size=$(stat -c%s artifacts/android-verify/with-llama.so)
          remote_so_size=$(stat -c%s artifacts/android-verify/remote-only.so)
          echo "APK bytes: WithLlama=$with_size RemoteOnly=$remote_size"
          echo "libnstrans_lib.so bytes: WithLlama=$with_so_size RemoteOnly=$remote_so_size"
          test "$with_so_size" -gt $((remote_so_size + 1048576)) || { echo "RemoteOnly appears to contain the local llama runtime" >&2; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: NSTrans-Android-arm64-debug-WithLlama
          path: artifacts/WithLlama/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: NSTrans-Android-arm64-debug-RemoteOnly
          path: artifacts/RemoteOnly/*
          if-no-files-found: error

  android-tv:
    name: Android TV · Subtitle client
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Build TV debug APK
        working-directory: androidscreenclient
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/NSTrans-TV-0.2.4-Android-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NSTrans-TV-Android-debug
          path: androidscreenclient/artifacts/NSTrans-TV-0.2.4-Android-debug.apk
          if-no-files-found: error

  windows:
    name: Windows · WithLlama + RemoteOnly
    runs-on: windows-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install dependencies and MeikiOCR runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm ci --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-windows-runtime.ps1 -OllamaVersion $env:WINDOWS_OLLAMA_VERSION -NoLlama
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build RemoteOnly installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run windows:build:remote
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts/RemoteOnly | Out-Null
          $Source = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction Stop | Select-Object -First 1
          if (-not $Source) { throw "RemoteOnly NSIS installer was not produced." }
          Copy-Item $Source.FullName artifacts/RemoteOnly/NSTrans-Windows-x64-RemoteOnly-setup.exe
      - name: Upload RemoteOnly installer
        uses: actions/upload-artifact@v4
        with:
          name: NSTrans-Windows-x64-RemoteOnly
          path: artifacts/RemoteOnly/*
          if-no-files-found: error
      - name: Install Llama runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & powershell -NoProfile -ExecutionPolicy Bypass -File scripts/setup-windows-runtime.ps1 -OllamaVersion $env:WINDOWS_OLLAMA_VERSION
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build WithLlama installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          npm run windows:build:full
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force artifacts/WithLlama | Out-Null
          $Source = Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe" -ErrorAction Stop | Select-Object -First 1
          if (-not $Source) { throw "WithLlama NSIS installer was not produced." }
          Copy-Item $Source.FullName artifacts/WithLlama/NSTrans-Windows-x64-WithLlama-setup.exe
      - name: Upload WithLlama installer
        uses: actions/upload-artifact@v4
        with:
          name: NSTrans-Windows-x64-WithLlama
          path: artifacts/WithLlama/*
          if-no-files-found: error
