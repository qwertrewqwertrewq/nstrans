name: Promote platform build artifacts

on:
  workflow_run:
    workflows: ["Cross-platform builds"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Cross-platform builds run ID
        required: true
        type: string
      tag:
        description: Existing GitHub Release tag
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  promote:
    name: Publish WithLlama and RemoteOnly assets
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Resolve source build and release
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
          MANUAL_TAG: ${{ inputs.tag }}
          COMPLETED_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            run_id="$MANUAL_RUN_ID"
            release_tag="$MANUAL_TAG"
          else
            run_id="$COMPLETED_RUN_ID"
            release_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=20" \
              --jq '[.[] | select(.draft == false)][0].tag_name')
          fi
          [[ -n "$run_id" ]] || { echo "Source build run ID is missing." >&2; exit 1; }
          [[ -n "$release_tag" && "$release_tag" != "null" ]] || { echo "No published Release was found." >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "Promoting build run $run_id to $release_tag"

      - name: Download all platform artifacts
        uses: actions/download-artifact@v5
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve.outputs.run_id }}
          pattern: NSTrans-*
          merge-multiple: true
          path: downloaded

      - name: Validate, version and checksum assets
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          mkdir -p release-assets

          stage() {
            source_name="$1"
            target_name="$2"
            if [[ ! -f "downloaded/$source_name" ]]; then
              echo "Required artifact is missing: $source_name" >&2
              exit 1
            fi
            cp "downloaded/$source_name" "release-assets/$target_name"
            sha256sum "release-assets/$target_name" \
              | sed 's#release-assets/##' \
              > "release-assets/$target_name.sha256"
          }

          stage NSTrans-macOS-arm64-WithLlama.dmg \
            "NSTrans-$version-macOS-arm64-WithLlama.dmg"
          stage NSTrans-macOS-arm64-RemoteOnly.dmg \
            "NSTrans-$version-macOS-arm64-RemoteOnly.dmg"
          stage NSTrans-iPadOS-arm64-unsigned-WithLlama.ipa \
            "NSTrans-$version-iPadOS-arm64-unsigned-WithLlama.ipa"
          stage NSTrans-iPadOS-arm64-unsigned-RemoteOnly.ipa \
            "NSTrans-$version-iPadOS-arm64-unsigned-RemoteOnly.ipa"
          stage NSTrans-Android-arm64-debug-WithLlama.apk \
            "NSTrans-$version-Android-arm64-debug-WithLlama.apk"
          stage NSTrans-Android-arm64-debug-RemoteOnly.apk \
            "NSTrans-$version-Android-arm64-debug-RemoteOnly.apk"
          stage NSTrans-Windows-x64-WithLlama-setup.exe \
            "NSTrans-$version-Windows-x64-WithLlama-setup.exe"
          stage NSTrans-Windows-x64-RemoteOnly-setup.exe \
            "NSTrans-$version-Windows-x64-RemoteOnly-setup.exe"
          stage NSTrans-TV-0.2.4-Android-debug.apk \
            "NSTrans-TV-0.2.4-Android-debug.apk"

          find release-assets -maxdepth 1 -type f -print | sort

      - name: Upload assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
        shell: bash
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          gh release upload "$RELEASE_TAG" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
