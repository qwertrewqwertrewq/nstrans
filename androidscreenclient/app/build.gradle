plugins {
    id "com.android.application"
}

android {
    namespace "com.example.androidscreenclient"
    compileSdk 34

    defaultConfig {
        applicationId "com.example.androidscreenclient"
        minSdk 23
        targetSdk 23
        versionCode 6
        versionName "0.2.4"
    }

    lint {
        // This APK intentionally targets legacy Android TV firmware while
        // remaining installable on Android 6. It is distributed outside Play.
        disable "ExpiredTargetSdkVersion", "MissingTvBanner"
    }
}
